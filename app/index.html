<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>軽貨ログ（試作版）｜運転日報アプリ</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif; background:#0a1428; color:#f2f5fa; line-height:1.6; }
  .app { max-width:520px; margin:0 auto; min-height:100dvh; display:flex; flex-direction:column; }
  header { padding:16px 18px 10px; display:flex; align-items:center; gap:10px; }
  .logo { font-size:20px; font-weight:800; }
  .logo .truck { color:#ff7a1a; }
  .proto { font-size:11px; color:#ffb066; border:1px solid #7a4a12; border-radius:999px; padding:2px 10px; }
  main { flex:1; padding:6px 16px 90px; }
  .view { display:none; }
  .view.on { display:block; }
  /* chat */
  .chat { display:flex; flex-direction:column; gap:9px; padding-top:8px; }
  .b { max-width:85%; padding:10px 13px; border-radius:16px; font-size:15px; line-height:1.55; animation:pop .18s ease; }
  @keyframes pop { from { opacity:0; transform:translateY(4px);} to { opacity:1; transform:none;} }
  .b.sys { background:#16263f; border:1px solid #22365c; align-self:flex-start; border-bottom-left-radius:4px; }
  .b.me { background:#ff7a1a; color:#fff; align-self:flex-end; border-bottom-right-radius:4px; }
  .b.card { background:#fff; color:#1c2733; align-self:stretch; max-width:100%; border-radius:14px; padding:14px 16px; }
  .b.card h3 { font-size:15px; margin-bottom:8px; color:#0a1428; }
  .b.card table { width:100%; border-collapse:collapse; font-size:14px; }
  .b.card td { padding:3px 0; border-bottom:1px dashed #e2e8f0; }
  .b.card td:last-child { text-align:right; font-weight:700; }
  .b.card .save { margin-top:10px; font-size:12.5px; color:#0b6b3a; font-weight:700; }
  .composer { position:sticky; bottom:74px; background:#0d1a30; border:1px solid #22365c; border-radius:14px; padding:12px; margin-top:14px; }
  .composer .hint { font-size:12px; color:#9fb2cc; margin-bottom:8px; }
  .row { display:flex; gap:8px; }
  .row input { flex:1; background:#0a1428; border:1px solid #2a3c5f; border-radius:10px; padding:12px; color:#fff; font-size:16px; min-width:0; }
  .row button { background:#ff7a1a; color:#fff; border:none; font-weight:800; border-radius:10px; padding:0 18px; font-size:15px; cursor:pointer; }
  .chips { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
  .chip { background:#16263f; border:1px solid #2a3c5f; color:#f2f5fa; border-radius:999px; padding:8px 14px; font-size:14px; cursor:pointer; }
  .chip.primary { background:#ff7a1a; border-color:#ff7a1a; color:#fff; font-weight:700; }
  /* list */
  .day { background:#101f3a; border:1px solid #22365c; border-radius:12px; padding:14px 16px; margin-bottom:10px; cursor:pointer; }
  .day .d { font-weight:800; font-size:15px; }
  .day .s { display:flex; gap:14px; font-size:13px; color:#9fb2cc; margin-top:4px; flex-wrap:wrap; }
  .day .s b { color:#f2f5fa; }
  .empty { text-align:center; color:#9fb2cc; padding:36px 10px; font-size:14px; }
  .detail { background:#fff; color:#1c2733; border-radius:14px; padding:18px; }
  .detail h3 { font-size:16px; text-align:center; margin-bottom:4px; }
  .detail .sub { text-align:center; font-size:12px; color:#64748b; margin-bottom:12px; }
  .detail table { width:100%; border-collapse:collapse; font-size:14px; }
  .detail td { padding:7px 4px; border-bottom:1px solid #e2e8f0; }
  .detail td:first-child { color:#475569; width:38%; }
  .detail td:last-child { text-align:right; font-weight:600; }
  .back { display:inline-block; margin-bottom:12px; color:#ffb066; font-size:14px; cursor:pointer; }
  .del { margin-top:14px; width:100%; background:none; border:1px solid #7a2a12; color:#ff9a66; border-radius:10px; padding:10px; font-size:14px; cursor:pointer; }
  /* summary */
  .monthbar { display:flex; align-items:center; gap:10px; margin:8px 0 14px; }
  .monthbar select { background:#101f3a; color:#fff; border:1px solid #2a3c5f; border-radius:10px; padding:10px; font-size:15px; }
  .kpis { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .kpi { background:#101f3a; border:1px solid #22365c; border-radius:12px; padding:14px; }
  .kpi .k { font-size:12px; color:#9fb2cc; }
  .kpi .v { font-size:22px; font-weight:900; margin-top:2px; }
  .kpi .v.orange { color:#ff7a1a; }
  .csv { margin-top:16px; width:100%; background:#16263f; border:1px solid #2a3c5f; color:#fff; border-radius:10px; padding:13px; font-size:15px; font-weight:700; cursor:pointer; }
  .note { font-size:12px; color:#7e90ad; margin-top:14px; }
  /* tabbar */
  nav { position:fixed; left:0; right:0; bottom:0; background:#0d1a30; border-top:1px solid #22365c; display:flex; z-index:10; }
  nav .in { max-width:520px; margin:0 auto; display:flex; width:100%; }
  nav button { flex:1; background:none; border:none; color:#9fb2cc; font-size:12px; padding:10px 0 calc(10px + env(safe-area-inset-bottom)); cursor:pointer; }
  nav button .ic { display:block; font-size:19px; margin-bottom:1px; }
  nav button.on { color:#ff7a1a; font-weight:800; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo"><span class="truck">■</span> 軽貨ログ</div>
    <div class="proto">試作版</div>
  </header>
  <main>
    <!-- 入力 -->
    <div class="view on" id="v-input">
      <div class="chat" id="chat"></div>
      <div class="composer" id="composer"></div>
    </div>
    <!-- 日報 -->
    <div class="view" id="v-list">
      <div id="listwrap"></div>
    </div>
    <!-- 集計 -->
    <div class="view" id="v-sum">
      <div class="monthbar">
        <span style="font-size:14px;color:#9fb2cc;">対象月</span>
        <select id="monthsel"></select>
      </div>
      <div class="kpis">
        <div class="kpi"><div class="k">売上合計</div><div class="v" id="k-sales">¥0</div></div>
        <div class="kpi"><div class="k">経費合計</div><div class="v" id="k-exp">¥0</div></div>
        <div class="kpi"><div class="k">利益</div><div class="v orange" id="k-profit">¥0</div></div>
        <div class="kpi"><div class="k">稼働日数</div><div class="v" id="k-days">0日</div></div>
        <div class="kpi"><div class="k">走行距離合計</div><div class="v" id="k-dist">0km</div></div>
        <div class="kpi"><div class="k">1日平均 利益</div><div class="v" id="k-avg">¥0</div></div>
      </div>
      <button class="csv" id="csvbtn">確定申告用 CSV をダウンロード</button>
      <p class="note">CSVは「日付・売上・経費・利益・走行距離」の月次明細です。収支内訳書への転記に使えます。</p>
      <p class="note">この試作版のデータは、この端末の中だけに保存されます（サーバーには送られません）。</p>
    </div>
  </main>
  <nav><div class="in">
    <button id="t-input" class="on"><span class="ic">✎</span>入力</button>
    <button id="t-list"><span class="ic">▤</span>日報</button>
    <button id="t-sum"><span class="ic">¥</span>集計</button>
  </div></nav>
</div>
<script>
const KEY = 'keikaro_entries_v1';
const load = () => { try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch(e){ return []; } };
const saveAll = a => localStorage.setItem(KEY, JSON.stringify(a));
const yen = n => '¥' + Number(n||0).toLocaleString('ja-JP');
const today = () => { const d = new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
const fmtDate = s => { const [y,m,d] = s.split('-'); return y+'年'+Number(m)+'月'+Number(d)+'日'; };

/* ---------- tabs ---------- */
const views = { input:'v-input', list:'v-list', sum:'v-sum' };
function tab(name){
  Object.entries(views).forEach(([k,id]) => document.getElementById(id).classList.toggle('on', k===name));
  ['input','list','sum'].forEach(k => document.getElementById('t-'+k).classList.toggle('on', k===name));
  if (name==='list') renderList();
  if (name==='sum') renderSum();
}
document.getElementById('t-input').onclick = () => tab('input');
document.getElementById('t-list').onclick = () => tab('list');
document.getElementById('t-sum').onclick = () => tab('sum');

/* ---------- chat flow ---------- */
const chat = document.getElementById('chat');
const composer = document.getElementById('composer');
let draft = null, step = 0, expDraft = [];

function bubble(cls, html){
  const div = document.createElement('div');
  div.className = 'b ' + cls; div.innerHTML = html;
  chat.appendChild(div);
  div.scrollIntoView({behavior:'smooth', block:'end'});
  return div;
}
function setComposer(html){ composer.innerHTML = html; }
function numRow(placeholder, btnLabel, onSend){
  setComposer('<div class="row"><input id="cin" inputmode="numeric" type="number" min="0" placeholder="'+placeholder+'"><button id="cbtn">'+btnLabel+'</button></div>');
  const inp = document.getElementById('cin');
  inp.focus();
  const go = () => { const v = inp.value.trim(); if (v==='' ) return; onSend(Number(v)); };
  document.getElementById('cbtn').onclick = go;
  inp.addEventListener('keydown', e => { if (e.key==='Enter') go(); });
}
function chipsRow(hint, chips){
  setComposer('<div class="hint">'+hint+'</div><div class="chips">' +
    chips.map((c,i)=>'<button class="chip'+(c.primary?' primary':'')+'" data-i="'+i+'">'+c.label+'</button>').join('') + '</div>');
  composer.querySelectorAll('.chip').forEach(el => el.onclick = () => chips[Number(el.dataset.i)].fn());
}
function startFlow(){
  chat.innerHTML = '';
  draft = { date: today(), sales: 0, expenses: [], distance: 0, start:'', end:'' };
  expDraft = [];
  bubble('sys', 'おつかれさまです。今日の運行日報を作ります。');
  bubble('sys', '日付は今日（' + fmtDate(draft.date) + '）でいいですか？');
  chipsRow('日付の確認', [
    { label:'はい、今日', primary:true, fn: () => { bubble('me','はい、今日'); askSales(); } },
    { label:'別の日', fn: () => {
        setComposer('<div class="row"><input id="cin" type="date" value="'+draft.date+'"><button id="cbtn">決定</button></div>');
        document.getElementById('cbtn').onclick = () => { const v = document.getElementById('cin').value; if (v) draft.date = v; bubble('me', fmtDate(draft.date)); askSales(); };
    } }
  ]);
}
function askSales(){
  bubble('sys', '本日の売上を教えてください（円）。');
  numRow('例：12500', '送信', v => { draft.sales = v; bubble('me', yen(v)); askExpLabel(); });
}
const EXP_LABELS = ['燃料','駐車場','高速代','その他'];
function askExpLabel(){
  bubble('sys', '経費はありますか？ 項目を選んでください。');
  const chips = EXP_LABELS.map(l => ({ label:l, fn: () => { bubble('me', l); askExpAmount(l); } }));
  chips.push({ label:'経費なし／入力おわり', primary:true, fn: () => { bubble('me','経費は以上'); askDistance(); } });
  chipsRow('経費の入力（複数回OK）', chips);
}
function askExpAmount(label){
  bubble('sys', label + ' はいくらでしたか？（円）');
  numRow('例：2100', '追加', v => {
    expDraft.push({ label, amount: v });
    bubble('me', label + ' ' + yen(v));
    draft.expenses = expDraft.slice();
    askExpLabel();
  });
}
function askDistance(){
  bubble('sys', '本日の走行距離を教えてください（km）。');
  numRow('例：78', '送信', v => { draft.distance = v; bubble('me', v + 'km'); askTimes(); });
}
function askTimes(){
  bubble('sys', '運行の開始・終了時刻が分かれば入れてください（任意）。');
  setComposer('<div class="row"><input id="ts" type="time"><input id="te" type="time"><button id="cbtn">決定</button></div><div class="chips"><button class="chip" id="skip">スキップ</button></div>');
  document.getElementById('cbtn').onclick = () => {
    draft.start = document.getElementById('ts').value || '';
    draft.end = document.getElementById('te').value || '';
    bubble('me', (draft.start||'―') + ' 〜 ' + (draft.end||'―'));
    finish();
  };
  document.getElementById('skip').onclick = () => { bubble('me','スキップ'); finish(); };
}
function expTotal(e){ return (e.expenses||[]).reduce((s,x)=>s+x.amount,0); }
function finish(){
  const entries = load();
  const idx = entries.findIndex(e => e.date === draft.date);
  if (idx >= 0) entries[idx] = draft; else entries.push(draft);
  entries.sort((a,b)=> a.date < b.date ? -1 : 1);
  saveAll(entries);
  const et = expTotal(draft);
  bubble('card', '<h3>'+fmtDate(draft.date)+' の日報</h3><table>' +
    '<tr><td>売上</td><td>'+yen(draft.sales)+'</td></tr>' +
    '<tr><td>経費</td><td>'+yen(et)+'</td></tr>' +
    '<tr><td>利益</td><td>'+yen(draft.sales-et)+'</td></tr>' +
    '<tr><td>走行距離</td><td>'+draft.distance+'km</td></tr>' +
    (draft.start||draft.end ? '<tr><td>運行時間</td><td>'+(draft.start||'―')+' 〜 '+(draft.end||'―')+'</td></tr>' : '') +
    '</table><div class="save">✓ 日報を保存しました。「日報」タブでいつでも見られます。</div>');
  chipsRow('つづき', [
    { label:'集計を見る', primary:true, fn: () => tab('sum') },
    { label:'別の日を入力', fn: () => startFlow() }
  ]);
}
startFlow();

/* ---------- list ---------- */
function renderList(){
  const wrap = document.getElementById('listwrap');
  const entries = load().slice().sort((a,b)=> a.date < b.date ? 1 : -1);
  if (!entries.length){ wrap.innerHTML = '<div class="empty">まだ日報がありません。<br>「入力」タブから今日の分を作ってみてください。</div>'; return; }
  wrap.innerHTML = '';
  entries.forEach(e => {
    const et = expTotal(e);
    const div = document.createElement('div');
    div.className = 'day';
    div.innerHTML = '<div class="d">'+fmtDate(e.date)+'</div><div class="s"><span>売上 <b>'+yen(e.sales)+'</b></span><span>経費 <b>'+yen(et)+'</b></span><span>利益 <b>'+yen(e.sales-et)+'</b></span><span>'+e.distance+'km</span></div>';
    div.onclick = () => renderDetail(e.date);
    wrap.appendChild(div);
  });
}
function renderDetail(date){
  const wrap = document.getElementById('listwrap');
  const e = load().find(x => x.date === date);
  if (!e) return renderList();
  const et = expTotal(e);
  const expRows = (e.expenses||[]).map(x => '<tr><td>経費（'+x.label+'）</td><td>'+yen(x.amount)+'</td></tr>').join('');
  wrap.innerHTML = '<span class="back" id="bk">← 一覧に戻る</span>' +
    '<div class="detail"><h3>運転日報</h3><div class="sub">貨物軽自動車運送事業 運行記録</div><table>' +
    '<tr><td>日付</td><td>'+fmtDate(e.date)+'</td></tr>' +
    '<tr><td>運行開始</td><td>'+(e.start||'―')+'</td></tr>' +
    '<tr><td>運行終了</td><td>'+(e.end||'―')+'</td></tr>' +
    '<tr><td>走行距離</td><td>'+e.distance+' km</td></tr>' +
    '<tr><td>売上</td><td>'+yen(e.sales)+'</td></tr>' +
    expRows +
    '<tr><td>経費合計</td><td>'+yen(et)+'</td></tr>' +
    '<tr><td>利益</td><td>'+yen(e.sales-et)+'</td></tr>' +
    '</table><button class="del" id="del">この日報を削除</button></div>';
  document.getElementById('bk').onclick = renderList;
  document.getElementById('del').onclick = () => {
    if (confirm(fmtDate(date)+' の日報を削除しますか？')) { saveAll(load().filter(x => x.date !== date)); renderList(); }
  };
}

/* ---------- summary ---------- */
function renderSum(){
  const entries = load();
  const sel = document.getElementById('monthsel');
  const months = [...new Set(entries.map(e => e.date.slice(0,7)))].sort().reverse();
  const cur = today().slice(0,7);
  if (!months.includes(cur)) months.unshift(cur);
  const prev = sel.value;
  sel.innerHTML = months.map(m => '<option value="'+m+'">'+m.replace('-','年')+'月</option>').join('');
  sel.value = months.includes(prev) ? prev : cur;
  const m = sel.value;
  const list = entries.filter(e => e.date.slice(0,7) === m);
  const sales = list.reduce((s,e)=>s+e.sales,0);
  const exp = list.reduce((s,e)=>s+expTotal(e),0);
  const dist = list.reduce((s,e)=>s+Number(e.distance||0),0);
  document.getElementById('k-sales').textContent = yen(sales);
  document.getElementById('k-exp').textContent = yen(exp);
  document.getElementById('k-profit').textContent = yen(sales-exp);
  document.getElementById('k-days').textContent = list.length + '日';
  document.getElementById('k-dist').textContent = dist + 'km';
  document.getElementById('k-avg').textContent = list.length ? yen(Math.round((sales-exp)/list.length)) : '¥0';
  sel.onchange = renderSum;
  document.getElementById('csvbtn').onclick = () => {
    const rows = [['日付','売上','経費','利益','走行距離(km)']];
    list.slice().sort((a,b)=> a.date<b.date?-1:1).forEach(e => rows.push([e.date, e.sales, expTotal(e), e.sales-expTotal(e), e.distance]));
    const csv = '﻿' + rows.map(r => r.join(',')).join('\r\n');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv'}));
    a.download = 'nippo-' + m + '.csv';
    a.click();
    URL.revokeObjectURL(a.href);
  };
}
</script>
</body>
</html>
